<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葡萄价格分析平台 - 找回密码</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="static/css/zhuti.css">
    <style>
        :root {
            --primary-color: #6a3093;
            --secondary-color: #a044ff;
            --text-color: #333;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #f5e6ff 0%, #e6ccff 50%, #d9b3ff 100%);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 12px 32px rgba(106, 48, 147, 0.18);
            text-align: center;
        }
        .card i {
            font-size: 42px;
            color: var(--primary-color);
            margin-bottom: 18px;
        }
        .card h1 {
            font-size: 20px;
            color: var(--primary-color);
            margin-bottom: 14px;
        }
        .card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-align: left;
        }
        .card .actions {
            margin-top: 26px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 11px 26px;
            border-radius: 10px;
            font-size: 14px;
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="card">
        <i class="fas fa-key"></i>
        <h1>找回密码</h1>
        <p>本站为静态演示版本，未接入短信与邮箱服务，暂时无法自助重置密码。</p>
        <p>如需继续体验，请返回登录页使用演示账号，或在「注册」页面新建账号。</p>
        <div class="actions">
            <a class="btn" href="denglu.html">返回登录</a>
            <a class="btn btn-ghost" href="zhuce.html">去注册</a>
        </div>
    </div>
</body>
</html>
